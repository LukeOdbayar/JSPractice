<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <link rel="stylesheet" href="style.css">
    <script src="index.js" defer></script>
</head>

<body>
    <div class="container">
        <div id="title">
            Simple Quiz
        </div>

        <div class="start"><input type="text" id="inputName"><button class="btnStart">Let's Start</button></div>
        <div class="quiz">
            <h2 class="question">Question goes here</h2>
            <div class="btn-answer">
                <button class="btn1">Answer1</button>
                <button class="btn2">Answer2</button>
                <button class="btn3">Answer3</button>
            </div>
            <div class="action">
                <!-- <button class="btnPervious">Pervious</button> -->
                <button class="btnNext">Next</button>
            </div>


        </div>
    </div>

</body>

</html>
