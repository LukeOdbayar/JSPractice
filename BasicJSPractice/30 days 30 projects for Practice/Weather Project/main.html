<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
    <script src="index.js" defer></script>
</head>

<body>
    <div class="card">
        <div class="search"><input id="inputSearch" type="text" placeholder="Enter city name"><button
                class="btnSearch"><img src="images/search.png"></button>
        </div>
        <div class="error">
            <p>Invalid city name</p>
        </div>
        <div class="weather">
            <img src="images/sun.png" class="weather-icon"></img>
            <h1 class="temp">26°</h1>
            <h2 class="city">Dublin</h2>
            <div class="details">
                <div class="col">
                    <img src="images/humidity.png" alt="" srcset="">
                    <div>
                        <p class="humidity">1%</p>
                        <p>Humidity</p>
                    </div>
                </div>
                <div class="col">
                    <img src="images/wind.png" alt="" srcset="">
                    <div>
                        <p class="wind">20 km/h</p>
                        <p>Wind</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
