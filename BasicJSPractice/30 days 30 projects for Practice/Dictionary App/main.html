<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dictioanry App</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <audio src="" id="sound"></audio>
    <div class="container">
        <div class="search-box">
            <input type="text" placeholder="Type the word here" id="inp-word">
            <button id="search-btn">Search</button>
        </div>
        <div id="result" class="result">
            <div class="word">
                <h3>Sample</h3>
                <button><img src="icons/soundwave.svg" alt="" srcset=""></button>
            </div>
            <div class="details">
                <p>pos</p>
                <p>/ˈsæm.pəl/</p>
            </div>
            <p class="word-meaning">a small amount of something that shows you what the rest is or should be like:</p>
            <p class="word-example">a free sample of shampoo</p>
        </div>
    </div>
</body>
<script src="index.js"></script>

</html>
