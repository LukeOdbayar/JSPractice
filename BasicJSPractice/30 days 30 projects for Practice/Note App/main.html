<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note App</title>
    <link rel="stylesheet" href="style.css">
    <script src="index.js" defer></script>
</head>

<body>
    <header>
        <h1>Quick Notes</h1>
        <button class="add-note-btn" onclick="openNoteDialog()">+ Add note</button>
        <button id="themeToggleBtn" class="theme-toggle-btn">moon</button>
    </header>

    <main id="notesContainer" class="notes-grid"></main>

    <dialog id="noteDialog">
        <div class="dialog-content">
            <div class="dialog-header">
                <h2 id="dialogTitle" class="dialog-title"></h2>
                <button onclick="closeNoteDialog()" class="close-btn">X</button>
            </div>
        </div>
        <form id="noteForm">
            <div class="form-group">
                <label for="noteTitle" class="form-label">Title</label>
                <input type="text" id="noteTitle" class="form-input" placeholder="Write note title ..." required>
            </div>
            <div class="form-group">
                <label for="noteContent" class="form-label">Content</label>
                <textarea id="noteContent" class="form-textarea" placeholder="Write your note here ..."
                    required></textarea>
            </div>
            <div class="dialog-actions">
                <button type="button" class="cancel-btn" onclick="closeNoteDialog()">Cancel</button>
                <button type="submit" class="save-btn">Save Note</button>
            </div>
        </form>
    </dialog>

</body>

</html>
