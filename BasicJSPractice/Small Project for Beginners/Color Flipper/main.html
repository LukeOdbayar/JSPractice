<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Flipper</title>
    <script src="index.js" defer></script>
    <link rel='stylesheet' type='text/css' media='screen' href="style.css">
</head>
<body>
    <div class="container"><h3>Color Flipper</h3> 
        <div class="inner-container">
            <button onclick="setColor('green')" style="background-color: green;" id="btnGreen">Green</button>
            <button onclick="setColor('red')" style="background-color: red;" id="btnRed">Red</button>
            <button onclick="setColor('blue')" style="background-color: blue;" id="btnBlue">Blue</button>
            <button onclick="setRandomColor()" id="btnRandom">Random</button>
        </div>
    </div>
</body>
</html>
